name: zhixing

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zhixing
      POSTGRES_PASSWORD: zhixing
      POSTGRES_DB: zhixing
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - zhixing-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhixing -d zhixing"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - zhixing-minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      additional_contexts:
        shared: ./packages/shared
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8787
      DATABASE_URL: postgres://zhixing:zhixing@postgres:5432/zhixing
      # 单用户私有部署：首次初始化口令。生产环境务必替换，并关闭远程初始化。
      ZX_SETUP_TOKEN: ${ZX_SETUP_TOKEN:-dev-setup-token}
      # 仅本机 Docker 验收使用；公网部署请改为 false 并通过宿主机本机初始化。
      ZX_SETUP_ALLOW_REMOTE: ${ZX_SETUP_ALLOW_REMOTE:-true}
      ZX_PUBLIC_URL: http://localhost:8787
      ZX_ACCESS_TTL: 86400
      ZX_REFRESH_TTL: 2592000
      ZX_PAIRING_TTL: 600
      ZX_ADMIN_SESSION_TTL: 43200
      ZX_MAX_DEVICES: 20
      ZX_S3_ENDPOINT: http://minio:9000
      ZX_S3_PUBLIC_ENDPOINT: http://localhost:9000
      ZX_S3_REGION: us-east-1
      ZX_S3_BUCKET: zhixing
      ZX_S3_ACCESS_KEY: minioadmin
      ZX_S3_SECRET_KEY: minioadmin
      ZX_S3_FORCE_PATH_STYLE: "true"
      ZX_S3_AUTO_CREATE_BUCKET: "true"
      ZX_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://tauri.localhost,tauri://localhost
    ports:
      - "8787:8787"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  zhixing-pgdata:
  zhixing-minio:
