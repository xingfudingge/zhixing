let state;const dbReq=indexedDB.open('zhixing-local-demo',1);dbReq.onupgradeneeded=()=>dbReq.result.createObjectStore('kv');dbReq.onsuccess=()=>{const db=dbReq.result,tx=db.transaction('kv','readonly'),q=tx.objectStore('kv').get('state');q.onsuccess=()=>{state=q.result||structuredClone(seed);normalizeState();render();save()}};dbReq.onerror=()=>{state=JSON.parse(localStorage.getItem('zhixing-demo')||'null')||structuredClone(seed);normalizeState();render()};

有 '+dateDistance(c.date)}<small> 天</small></strong><button class="btn" onclick="editCountdown('${c.id}')">查看/编辑</button></article>`).join('')||'<div class="event-empty">该分类还没有倒数日</div>'}</div>`}else{body=`<div class="page-head"><div><h2>小工具</h2><div class="subtitle">日期工具离线可用；计算结果仅供查询，不会创建待办</div></div></div><div class="tool-tabs">${[['days','天数计算'],['lunar','农历转换'],['zodiac','生肖查询'],['clock','全屏时钟']].map(([k,l])=>`<button class="${toolMode===k?'active':''}" onclick="toolMode='${k}';render()">${l}</button>`).join('')}</div>${toolMode==='days'?`<section class="tool-card"><p>计算两个日期之间相隔的天数，或包含首尾两天的总天数。</p><label>时间 1 <input id="daysA" type="date" value="2026-09-10" onchange="calcDays()"></label><label>时间 2 <input id="daysB" type="date" value="2026-09-10" onchange="calcDays()"></label><div class="calc-result">相隔天数 <b id="daysResult">0 天</b> <button class="btn" onclick="toggleInclusive()">切换：包含首尾</button></div></section>`:toolMode==='lunar'?`<section class="tool-card"><p>公历与农历日期互转；离线使用随应用发布的农历数据包。</p><label>公历 <input id="solarDate" type="date" value="2026-10-25" onchange="convertSolarToLunar()"></label><div class="lunar-result">农历　<b id="lunarResult">丙午年 九月十六</b></div><label>农历生日提醒<select><option>每年重复（农历）</option><option>闰月当月执行</option><option>非闰月执行</option></select></label><button class="btn" onclick="toast('农历生日可加入倒数日，并在每年农历日期提醒')">加入倒数日</button></section>`:toolMode==='zodiac'?`<section class="tool-card"><p>选择年份，查看生肖对应年份与年龄。</p><label>查询年份 <input id="zodiacYear" type="number" value="2026" onchange="renderZodiac()"></label><div class="zodiac-result"><b id="zodiacAnimal">马</b><div id="zodiacYears">2020 年出生 · 7岁<br>2008 年出生 · 19岁<br>1996 年出生 · 31岁</div></div></section>`:`<section class="clock-card"><div id="clockDisplay">00:00</div><p>全屏时钟 · 知行</p><button class="btn" onclick="toggleClockFullscreen()">⛶ 全屏显示</button></section>`}`};return `<div class="page calendar-extra">${calendarNav()}${body}</div>`}
function lunarLabel(day){const terms={'2026-10-08':'寒露','2026-10-23':'霜降','2026-11-07':'立冬','2026-11-22':'小雪','2026-12-07':'大雪','2026-12-22':'冬至'};if(terms[day])return terms[day];try{let parts=new Intl.DateTimeFormat('zh-u-ca-chinese',{day:'numeric'}).formatToParts(new Date(day+'T12:00:00')),n=Number(parts.find(p=>p.type==='day')?.value);if(!n)return '';let nums=['','一','二','三','四','五','六','七','八','九','十'];return n<=10?'初'+nums[n]:n<20?'十'+nums[n-10]:n===20?'二十':n<30?'廿'+nums[n-20]:'三十'}catch{return ''}}
function isoWeek(day){let d=new Date(day+'T12:00:00');d.setDate(d.getDate()+4-(d.getDay()||7));let y=new Date(d.getFullYear(),0,1);return Math.ceil((((d-y)/86400000)+1)/7)}
let inclusiveDays=false;
function calcDays(){let a=document.getElementById('daysA')?.value,b=document.getElementById('daysB')?.value,r=document.getElementById('daysResult');if(!a||!b||!r)return;let x=new Date(a+'T00:00:00'),y=new Date(b+'T00:00:00');r.textContent=(Math.abs(Math.round((y-x)/86400000))+(inclusiveDays?1:0))+' 天'}

function calendar(){if(calendarSection!=='calendar')return calendarExtra();let year=calendarMonth.getFullYear(),month=calendarMonth.getMonth(),monthNo=month+1;let yearControl=`<div class="cal-head"><button class="btn" onclick="calendarMonth=new Date(calendarMonth.getFullYear()-1,calendarMonth.getMonth(),1);render()">‹</button><h2>${year} 年</h2><button class="btn" onclick="calendarMonth=new Date(calendarMonth.getFullYear()+1,calendarMonth.getMonth(),1);render()">›</button><button class="btn" onclick="calendarMonth=new Date(2026,9,1);calendarSelectedDay='2026-10-25';render()">今天</button><select onchange="calendarMode=this.value;render()"><option value="year" ${calendarMode==='year'?'selected':''}>全年概览</option><option value="month" ${calendarMode==='month'?'selected':''}>月视图</option><option value="week" ${calendarMode==='week'?'selected':''}>周视图</option><option value="day" ${calendarMode==='day'?'selected':''}>日视图</option></select></div>`;let view='';if(calendarMode==='year'){view=`<div class="year-grid">${Array.from({length:12},(_,m)=>{let days=new Date(year,m+1,0).getDate(),label=`${year}-${String(m+1).padStart(2,'0')}`,heat=state.tasks.filter(t=>t.dueDate?.startsWith(label)).length;return `<button class="year-month" onclick="calendarMonth=new Date(${year},${m},1);calendarMode='month';render()"><b>${m+1}月</b><small>${heat} 项安排</small><div class="mini-days">${Array.from({length:days},(_,d)=>`<i class="${state.tasks.some(t=>t.dueDate===`${label}-${String(d+1).padStart(2,'0')}`)?'has-task':''}"></i>`).join('')}</div></button>`}).join('')}</div>`}else if(calendarMode==='day'){let day=calendarSelectedDay,items=state.tasks.filter(t=>t.dueDate===day),dayEvents=state.calendarEvents.filter(e=>e.date===day);view=`<section class="panel day-calendar"><h3>${day} · 当日安排</h3>${items.map(t=>`<div class="day-event" onclick="editTask('${t.id}')"><span class="event-dot"></span><b>${esc(t.title)}</b><small>${esc(t.time||'未安排时间')}</small></div>`).join('')||'<p class="subtitle">这一天还没有全局待办 span>`).join('')}${state.countdowns.filter(c=>c.date===day).slice(0,1).map(c=>`<span class="countdown-dot">${esc(c.title)}</span>`).join('')}${events}</div>`}view=`<div class="calendar-wrap"><div class="calendar">${cells}</div></div><aside class="calendar-day-panel"><b>${calendarSelectedDay}</b><span>${state.tasks.filter(t=>t.dueDate===calendarSelectedDay&&!t.done).length} 项待办</span><span>${lunarLabel(calendarSelectedDay)} · ${calendarSelectedDay==='2026-10-25'?'戊戌月 · 壬申日':'农历日期'}</span><span>宜：出行、学习　忌：无</span><button class="btn" onclick="calendarMode='day';render()">查看当天安排 →</button></aside>`}return `<div class="page"><div class="page-head"><div><h1>日历工作台</h1><div class="subtitle">从全年节奏到今天安排，任务、习惯、日程与笔记沿着日期连接</div></div><div class="head-actions"><button class="btn" onclick="show('preferences');setTimeout(()=>setPreferenceTab('calendar'),0)">⚙ 日历设置</button><button class="btn primary" onclick="show('preferences');setTimeout(()=>setPreferenceTab('calendar'),0)">＋ 订阅日历</button></div></div>${calendarNav()}${yearControl}<div class="calendar-legend"><span class="legend-holiday">法定节假日</span><span class="legend-workday">调休上班日</span><span class="legend-task">全局任务</span><span class="legend-sync">外部日历</span><span>点选日期查看当天安排</span></div>${view}<p class="subtitle calendar-footnote">中国大陆 · 官方节假日数据按年度发布并缓存；所选年如尚无官方安排会明确提示，不按周末推断。</p></div>`}

let diagramState=null,diagramDrag=null,boardConnectMode=false,boardConnectFrom=null,boardDirty=false,boardSaved=false,editingFigureEl=null,diagramNoteId=null,diagramBlockId=null,boardReturnScroll=0,boardNeedsInsert=false,selectedBoardNode=null;
function freshBoard(){return {mode:'canvas',title:'自由画板',rootId:null,nodes:[],edges:[],lanes:[],viewport:{x:0,y:0,zoom:1}}}
function openDiagramEditor(data=null,figureEl=null){diagramBlockId=figureEl?.dataset.blockId||null;enterBoard(data,figureEl)}
function addDiagramNode(type){let id='d'+Date.now(),idx=diagramState.nodes.length,label={process:'形状',decision:'判断条件',sticky:'便签',text:'双击编辑文本',start:'',frame:'分区标题',section:'分区标题',table:'表格',image:'图片占位'}[type]??'图形';diagramState.nodes.push({id,type,text:label,x:150+(idx%5)*190,y:140+Math.floor(idx/5)*120,w:type==='section'?350:148,h:type==='section'?210:58,rotation:0});selectedBoardNode=id;boardDirty=true;render();if(['text','sticky'].includes(type))setTimeout(()=>editDiagramNode(id),0)}

function resizeBoardNode(id,delta){let n=diagramState.nodes.find(x=>x.id===id);if(!n)return;n.w=Math.max(80,(n.w||148)+delta);n.h=Math.max(44,(n.h||58)+Math.round(delta*.4));boardDirty=true;render()}
function addBoardQuickNode(fromId,type,direction='right'){let from=diagramState.nodes.find(n=>n.id===fromId);if(!from)return;let id='d'+Date.now(),dx=direction==='left'?-220:direction==='up'?0:direction==='down'?0:220,dy=direction==='up'?-130:direction==='down'?130:0,next={id,type,text:type==='decision'?'判断条件':'下一步',x:Math.max(0,from.x+dx),y:Math.max(0,from.y+dy),w:148,h:58,rotation:0};diagramState.nodes.push(next);diagramState.edges.push({from:from.id,to:id,label:''});selectedBoardNode=id;boardDirty=true;render()}

function startBoardResize(e,id){e.preventDefault();e.stopPropagation();let n=diagramState.nodes.find(x=>x.id===id),sx=e.clientX,sy=e.clientY,sw=n.w||148,sh=n.h||58;e.currentTarget.setPointerCapture(e.pointerId);e.currentTarget.onpointermove=ev=>{n.w=Math.max(80,sw+ev.clientX-sx);n.h=Math.max(44,sh+ev.clientY-sy);let el=document.querySelector(`.diagram-node[data-node-id="${id}"]`);if(el){el.style.setProperty('--node-w',n.w+'px');el.style.setProperty('--node-h',n.h+'px')}boardDirty=true;refreshBoardStatus()};e.currentTarget.onpointerup=()=>{render()}}

function toggleBoardShapes(){let pop=document.getElementById('boardShapePop');if(pop)pop.remove();else{let rail=document.querySelector('.board-rail');rail.insertAdjacentHTML('afterend',`<div class="board-shape-pop" id="boardShapePop">${[['▭','process','矩形'],['◇','decision','菱形'],['○','start','圆形'],['▱','sticky','便签'],['▤','frame','画框'],['▦','table','表格'],['↗','connector','连接线'],['T','text','文本'],['⌁','image','图片'],['＋','plus','更多']].map(([icon,type,label])=>`<button title="${label}" aria-label="${label}" onclick="${type==='connector'?'toggleBoardConnector()':`addDiagramNode('${type}')`};document.getElementById('boardShapePop')?.remove()">${icon}</button>`).join('')}</div>`)} }

function renderDiagramEditor(){let nodes=diagramState.nodes,edges=diagramState.edges;let body=`<div class="board-workspace" id="boardWorkspace"><div class="diagram-canvas" id="diagramCanvas"><svg class="diagram-svg">${edges.map(e=>{let a=nodes.find(n=>n.id===e.from),b=nodes.find(n=>n.id===e.to);return a&&b?`<path d="M ${a.x+(a.w||148)} ${a.y+(a.h||58)/2} C ${(a.x+b.x)/2+74} ${a.y+(a.h||58)/2}, ${(a.x+b.x)/2+74} ${b.y+(b.h||58)/2}, ${b.x} ${b.y+(b.h||58)/2}" fill="none" stroke="currentColor" stroke-width="2" marker-end="url(#boardArrow)"/>`:''}).join('')}<defs><marker id="boardArrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#929bab"/></marker></defs></svg>${nodes.map(n=>`<div class="diagram-node ${n.type}" style="left:${n.x}px;top:${n.y}px;--node-w:${n.w||148}px;--node-h:${n.h||58}px;transform:rotate(${n.rotation||0}deg)" onpointerdown="startDiagramDrag(event,'${n.id}')" onclick="selectBoardConnector('${n.id}')" ondblclick="editDiagramNode('${n.id}')"><span>${esc(n.text)}</span><button onclick="event.stopPropagation();removeDiagramNode('${n.id}')">×</button></div>`).join('')}</div>${nodes.length?'':'<div class="board-empty-hint">画板<br><small>在空白处自由创作，所有内容都由你来摆放</small></div>'}<div class="board-status">${boardDirty?'● 有未保存修改':boardSaved?'● 已保存到笔记':'● 尚未插入笔记（退出会丢弃）'}</div><div class="board-bottom-right"><button onclick="toast('缩放到适合视图')">⊙ 适配</button><button onclick="toast('缩放比例 100%')">−　100%　＋</button></div></div>`;document.getElementById('modal').innerHTML=`<div class="board-app"><div class="board-top"><div class="board-top-left"><button onclick="closeModal()">×　退出</button><button class="board-name">▧　画板</button></div><div class="board-top-right"><button class="board-share" onclick="saveDiagram()">✔ 插入笔记</button><button class="board-share" onclick="toast('分享设置')">↗ 分享</button><button onclick="toast('当前为编辑模式')">✎ 编辑⌄</button><button onclick="toast('搜索画板内容')">⌕</button><button onclick="toast('画板评论')">▢</button><button onclick="toast('更多画板操作')">···</button></div></div><div class="board-stage"><nav class="board-rail"><button title="图形" aria-label="图形" onclick="toggleBoardShapes()">◈</button><div class="board-divider"></div><button title="便签" aria-label="便签" onclick="addDiagramNode('sticky')">▱</button><button title="文本" aria-label="文本" onclick="addDiagramNode('text')">T</button><button title="评论" aria-label="评论" onclick="toast('在画布位置添加评论')">▢</button><button title="连接线" aria-label="连接线" id="boardConnector" onclick="toggleBoardConnector()">⌁</button><button title="画框" aria-label="画框" onclick="addDiagramNode('frame')">▣</button><button title="表格" aria-label="表格" onclick="addDiagramNode('table')">▦</button><button title="自由绘制" aria-label="自由绘制" onclick="toast('自由绘制工具已选择')">〰</button><button title="表情" aria-label="表情" onclick="toast('表情选择器')">☻</button><button title="图片" aria-label="图片" onclick="addDiagramNode('image')">▧</button><button title="更多工具" aria-label="更多工具" onclick="toggleBoardShapes()">⠿</button><div class="board-divider"></div><button title="评论面板" aria-label="评论面板" onclick="toast('画板评论')">▱</button></nav>${body}</div></div>`;document.getElementById('modalBack').classList.add('board-open');document.getElementById('modal').classList.add('board-modal');openModalUI()}

function connectDiagramNodes(){let from=document.getElementById('edgeFrom').value,to=document.getElementById('edgeTo').value;if(!from||!to||from===to)return toast('请选择两个不同节点');if(diagramState.edges.some(e=>e.from===from&&e.to===to))return toast('这两个节点已连接');diagramState.edges.push({from,to,label:''});renderDiagramEditor()}

function startDiagramDrag(ev,id){if(ev.target.tagName==='BUTTON'||boardConnectMode)return;diagramDrag={id,x:ev.clientX,y:ev.clientY};ev.currentTarget.setPointerCapture(ev.pointerId);ev.currentTarget.onpointermove=e=>{if(!diagramDrag)return;let n=diagramState.nodes.find(x=>x.id===id),canvas=document.getElementById('diagramCanvas').getBoundingClientRect();n.x=Math.max(0,Math.min(canvas.width-150,n.x+e.clientX-diagramDrag.x));n.y=Math.max(0,Math.min(canvas.height-60,n.y+e.clientY-diagramDrag.y));diagramDrag.x=e.clientX;diagramDrag.y=e.clientY;boardDirty=true;e.currentTarget.style.left=n.x+'px';e.currentTarget.style.top=n.y+'px';redrawEdges();};ev.currentTarget.onpointerup=()=>{diagramDrag=null;render()}}

function openFormulaEditor(source=''){document.getElementById('modal').innerHTML=`<h2>插入公式</h2><p class="subtitle">输入 LaTeX，或插入常用结构；公式源与渲染结果一同保存。</p><div class="formula-symbols">${[['分数','\\frac{a}{b}'],['根号','\\sqrt{x}'],['上标','x^{2}'],['下标','x_{i}'],['求和','\\sum_{i=1}^{n}'],['积分','\\int_{a}^{b}'],['π','\\pi'],['≤','\\leq']].map(([l,v])=>`<button class="btn" onclick="appendFormula('${v.replace(/\\/g,'\\\\')}')">${l}</button>`).join('')}</div><label>LaTeX</label><textarea id="formulaSource" rows="3" placeholder="例如：\\frac{a+b}{c}">${esc(source)}</textarea><div class="formula-preview"><small>预览（轻量演示）</small><div id="formulaPreview">${esc(source||'公式预览')}</div></div><div class="info">正式客户端使用离线打包的数学公式渲染器；笔记块保存 LaTeX 源码，导出时按目标格式转换。</div><div class="modal-actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveFormula()">插入公式</button></div>`;document.getElementById('formulaSource').oninput=e=>document.getElementById('formulaPreview').innerHTML=previewFormula(e.target.value);openModalUI()}
function appendFormula(v){let e=document.getElementById('formulaSource');e.value+=v;e.dispatchEvent(new Event('input'))}
function previewFormula(src){let x=esc(src).replace(/\\(pi|theta|alpha|beta|infty|times|cdot|leq|geq)/g,(_,k)=>({pi:'π',theta:'θ',alpha:'α',beta:'β',infty:'∞',times:'×',cdot:'·',leq:'≤',geq:'≥'}[k]));x=x.replace(/\^\{([^}]+)\}/g,'<sup>$1</sup>').replace(/_\{([^}]+)\}/g,'<sub>$1</sub>').replace(/\^([A-Za-z0-9])/g,'<sup>$1</sup>').replace(/_([A-Za-z0-9])/g,'<sub>$1</sub>').replace(/\\sqrt\{([^}]+)\}/g,'√($1)').replace(/\\frac\{([^}]+)\}\{([^}]+)\}/g,'($1)/($2)');return x||'公式预览'}
function saveFormula(){let src=document.getElementById('formulaSource').value.trim();if(!src)return toast('请输入公式');insertAtNoteCursor(`<span class="formula-card" contenteditable="false" data-formula="${esc(src)}" onclick="editFormulaCard(this)">${previewFormula(src)} <small>fx</small></span>`);closeModal();toast('公式块已插入；可点击重新编辑')}
function editFormulaCard(el){openFormulaEditor(el.dataset.formula||'')}
function clips(){return `<div class="page"><div class="page-head"><div><h1>剪藏箱</h1><div class="subtitle">默认提取成可编辑笔记；也可以选择保存网页原貌或只留链接</div></div><div class="head-actions"><button class="btn primary" onclick="openCreate('clip')">＋ 剪藏网页</button></div></div><div class="clip-hint"><b>网页资料进入知识库</b><span>解析正文后可搜索、编辑、加标签、关联任务；网页原件可作为附件归档。</span></div>${state.clips.map((c,i)=>`<div class="panel clip-row"><div class="clip-icon">⌁</div><div class="clip-main"><b>${esc(c.title)}</b><div class="subtitle">${esc(c.url)}　·　${esc(c.time)}</div><div class="clip-meta"><span>${esc(c.mode||'解析为笔记')}</span><span>${esc(c.status||'已保存')}</span>${c.noteId?'<span>↗ 已生成知识笔记</span>':''}</div></div><button class="btn" onclick="createTaskFromClip(${i})">转为任务</button>${c.noteId?`<button class="btn" onclick="selectNote('${c.noteId}');show('knowledge')">打开笔记</button>`:`<button class="btn" onclick="clipToNote(${i})">存为笔记</button>`}<button class="btn" onclick="toast('演示：正式版打开原始网页/归档文件')">来源/原件</button></div>`).join('')}</div>`}
function habits(){let names=state.habits;return `<div class="page"><div class="page-head"><div><h1>习惯</h1><div class="subtitle">连续记录，也允许偶尔中断后重新开始</div></div><button class="btn primary" onclick="toast('新习惯设置原型入口')">＋ 新习惯</button></div><div class="panel habit-summary"><b>本周节奏</b><span>已完成 ${state.habits.reduce((a,h)=>a+h.checkedDays,0)} 次　·　最长连续 ${Math.max(0,...state.habits.map(h=>h.streak))} 天</span></div>${names.map((h,i)=>`<section class="panel habit-row"><div class="habit-icon hi-${i}">${['☀','▤','⌂'][i]}</div><div class="habit-info"><b>${esc(h.title)}</b><small>${esc(h.schedule)}</small><div class="weekdots">${['一','二','三','四','五','六','日'].map((d,j)=>`<button class="${j<h.checkedDays?'checked':''}" onclick="toggleHabit('${h.id}',${j})">${h.week[j]?'✓':d}</button>`).join('')}</div></div><span class="streak">🔥 ${h.streak}天</span><button class="btn" onclick="createTaskFromHabit('${h.id}')">安排行动</button></section>`).join('')}</div>`}
function focus(){return `<div class="page focus-page"><div class="page-head"><div><h1>专注</h1><div class="subtitle">让计时器和当前任务、笔记保持关联</div></div></div><section class="panel focus-card"><span class="focus-label">正在专注</span><h2 id="focusTask">完成新版产品需求文档</h2><div class="timer">25<span>:</span>00</div><div class="focus-actions"><button class="btn primary" onclick="logFocus('t1')">▶ 记录 25 分钟</button><button class="btn" onclick="toast('可选择其他任务')">切换任务</button></div><div class="detail-row">本次完成后　<b>记录 25 分钟专注</b></div></section><div class="panel"><h3>今日专注</h3><b>${Math.floor(state.focusSessions.reduce((a,x)=>a+x.minutes,0)/60)}小时 ${state.focusSessions.reduce((a,x)=>a+x.minutes,0)%60}分钟</b><small>　${state.focusSessions.length} 个番茄钟 · 关联任务累计</small></div></div>`}
function review(){return `<div class="page"><div class="page-head"><div><h1>复盘与统计</h1><div class="subtitle">最近 7 天 · 工作和生活都看得见</div></div><button class="btn">本周⌄</button></div><div class="stats-grid"><section class="panel stat"><small>已完成任务</small><b>${state.tasks.filter(t=>t.done).length}</b><span>与任务清单共用数据</span><div class="bars">${[35,55,48,75,60,92,67].map(x=>`<i style="height:${x}%"></i>`).join('')}</div></section><section class="panel stat"><small>专注时长</small><b>${(state.focusSessions.reduce((a,x)=>a+x.minutes,0)/60).toFixed(1)}h</b><span>${state.focusSessions.length} 次任务专注</span><div class="bars purple">${[60,40,80,55,75,90,48].map(x=>`<i style="height:${x}%"></i>`).join('')}</div></section><section class="panel stat"><small>习惯打卡</small><b>${state.habits.reduce((a,h)=>a+h.checkedDays,0)}次</b><span>记录在习惯模块</span><div class="bars amber">${[50,72,40,82,66,90,75].map(x=>`<i style="height:${x}%"></i>`).join('')}</div></section></div><section class="panel"><h3>本周回顾</h3><p class="subtitle">已完成 ${state.tasks.filter(t=>t.done).length} 项任务，当前有 ${state.notes.length} 篇笔记；专注记录和习惯打卡均来自对应模块。</p><button class="btn" onclick="saveReviewNote()">保存为复盘笔记</button></section></div>`}
let preferenceTab='appearance';function setPreferenceTab(tab){preferenceTab=tab;render()}
function applyPreferences(){let p=state?.preferences;if(!p)return;document.body.dataset.theme=p.theme==='dark'?'dark':'light';document.body.dataset.density=p.density||'comfortable';document.body.dataset.font=p.fontSize||'default';document.body.dataset.reduceMotion=p.reduceMotion?'true':'false';let colors={blue:'#5579d5',violet:'#8066c7',coral:'#d97664',teal:'#3a9b9a',amber:'#d89338'};document.documentElement.style.setProperty('--blue',colors[p.accent]||colors.blue)}
function setPref(key,value){state.preferences[key]=value;applyPreferences();save();render();toast('偏好已保存到本机')}
async function enableWebNotifications(){if(typeof Notification==='undefined'){toast('当前浏览器不支持通知 API');return}if(!window.isSecureContext){toast('浏览器通知需要 HTTPS 或 localhost 安全环境');return}let permission=Notification.permission;if(permission==='default')permission=await Notification.requestPermission();if(permission!=='granted'){state.preferences.webNotificationEnabled=false;save();render();toast(permission==='denied'?'权限已拒绝，请在浏览器站点设置中允许通知':'尚未获得浏览器通知权限');return}state.preferences.webNotificationEnabled=true;save();new Notification('知行提醒测试',{body:'网页通知已开启；正式提醒会依据任务时间和免打扰设置投递。',tag:'zhixing-test'});render();toast('网页通知已开启')}
async function toggleSystemNotifications(){let next=!state.preferences.systemNotificationEnabled;if(!window.__TAURI__){state.preferences.systemNotificationEnabled=next;save();render();toast(next?'已保存为桌面客户端偏好；浏览器预览不能代发系统通知':'已关闭设备系统通知');return}try{const n=window.__TAURI__.notification,ok=await n.isPermissionGranted();if(next&&!ok){let p=await n.requestPermission();if(p!=='granted'){toast('系统通知权限未开启');return}}state.preferences.systemNotificationEnabled=next;save();if(next)n.sendNotification({title:'知行提醒测试',body:'设备系统通知已开启'});render()}catch{toast('系统通知暂不可用，请检查应用权限')}}
function preferences(){let p=state.preferences;let tabs=[['appearance','外观'],['task','任务与记录'],['calendar','日历与工作日'],['notifications','提醒与通知'],['ocr','图片 OCR'],['privacy','隐私与安全']];let content='';if(preferenceTab==='appearance')content=`<h2>外观</h2><p class="subtitle">让工作台贴合你的习惯，偏好会跟随账户同步。</p><div class="pref-row"><div><b>界面主题</b><small>浅色、深色或跟随系统</small></div><select onchange="setPref('theme',this.value)"><option value="light" ${p.theme==='light'?'selected':''}>浅色</option><option value="dark" ${p.theme==='dark'?'selected':''}>深色</option><option value="system" ${p.theme==='system'?'selected':''}>跟随系统</option></select></div><div class="pref-row"><div><b>强调色</b><small>任务、选中状态和图表使用</small></div><div class="swatches">${[['blue','蓝莓蓝','#5579d5'],['violet','雾紫','#8066c7'],['coral','珊瑚','#d97664'],['teal','海盐青','#3a9b9a'],['amber','暖金','#d89338']].map(x=>`<button class="swatch ${p.accent===x[0]?'chosen':''}" style="--swatch:${x[2]}" title="${x[1]}" onclick="setPref('accent','${x[0]}')"></button>`).join('')}</div></div><div class="pref-row"><div><b>信息密度</b><small>选择列表行距</small></div><select onchange="setPref('density',this.value)"><option value="comfortable" ${p.density==='comfortable'?'selected':''}>舒适</option><option value="compact" ${p.density==='compact'?'selected':''}>紧凑</option></select></div><div class="pref-row"><div><b>字体大小</b><small>影响任务列表和阅读界面</small></div><select onchange="setPref('fontSize',this.value)"><option value="default">标准</option><option value="large" ${p.fontSize==='large'?'selected':''}>大</option></select></div><div class="pref-row"><div><b>减少动效</b><small>关闭非必要的过渡动画</small></div><button class="switch ${p.reduceMotion?'on':''}" onclick="setPref('reduceMotion',${!p.reduceMotion})"></button></div>`;else if(preferenceTab==='task')content=`<h2>任务与记录</h2><p class="subtitle">设置快速添加与任务呈现方式。</p><div class="pref-row"><div><b>默认清单</b><small>快速创建未选清单时使用</small></div><select onchange="setPref('defaultList',this.value)">${['收件箱','工作','生活','阅读计划'].map(x=>`<option ${p.defaultList===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="pref-row"><div><b>完成后保留在列表</b><small>适合集中检查完成事项</small></div><button class="switch ${p.keepCompleted?'on':''}" onclick="setPref('keepCompleted',${!p.keepCompleted})"></button></div><div class="pref-row"><div><b>新任务默认提醒</b><small>可在每条任务上单独调整</small></div><select onchange="setPref('defaultReminder',this.value)"><option value="none">不提醒</option><option value="at-time">到期时</option><option value="before-10">提前 10 分钟</option><option value="before-30">提前 30 分钟</option></select></div><div class="pref-row"><div><b>新笔记默认文件夹</b><small>跨设备共享此偏好</small></div><select onchange="setPref('defaultFolder',this.value)"><option>收件箱</option><option>工作记录</option><option>产品设计</option></select></div>`;else if(preferenceTab==='calendar')content=`<h2>日历与工作日</h2><p class="subtitle">任务日历、外部日程和国家节假日各自有来源标识，但集中在同一个日历视图。</p><div class="calendar-settings-card"><div class="calendar-setting-head"><div><b>中国法定节假日</b><small>官方年度安排 · 中国大陆 · 2026 年版</small></div><span class="source-status">● 已校核</span></div><p>来源：国务院办公厅国办发明电〔2025〕7号。覆盖法定假期和调休上班日；周末仍按官方日历显示，不将休息日自动转为假期。</p><a href="https://www.gov.cn/zhengce/zhengceku/202511/content_7047091.htm" target="_blank" rel="noreferrer">查看国务院办公厅原文 ↗</a><div class="setting-toggles"><label><input type="checkbox" ${p.showHolidays?'checked':''} onchange="setPref('showHolidays',this.checked)"> 显示法定节假日</label><label><input type="checkbox" ${p.showMakeupDays?'checked':''} onchange="setPref('showMakeupDays',this.checked)"> 显示调休上班日</label><label><input type="checkbox" ${p.showLunar?'checked':''} onchange="setPref('showLunar',this.checked)"> 显示农历</label></div></div><div class="pref-row"><div><b>每周从哪天开始</b><small>影响周视图和习惯统计</small></div><select onchange="setPref('weekStart',this.value)"><option value="monday" ${p.weekStart==='monday'?'selected':''}>星期一</option><option value="sunday" ${p.weekStart==='sunday'?'selected':''}>星期日</option></select></div><div class="pref-row"><div><b>工作时区</b><small>时间任务按时区显示；全天任务保持本地日期</small></div><select onchange="setPref('timezone',this.value)">${['Asia/Shanghai','Asia/Tokyo','America/Los_Angeles','Europe/London'].map(z=>`<option ${p.timezone===z?'selected':''}>${z}</option>`).join('')}</select></div><h3 class="pref-subhead">已连接的日历</h3><div class="calendar-source"><span class="source-icon">▦</span><div><b>知行任务日历</b><small>应用内任务 · 同一任务记录 · 自动更新</small></div><span class="source-status">● 正常</span></div>${state.calendarSources.map((c,i)=>`<div class="calendar-source"><span class="source-icon">${c.kind==='CalDAV'?'↔':'↗'}</span><div><b>${esc(c.name)}</b><small>${esc(c.kind)} · ${c.kind==='iCalendar URL'?'只读订阅':'授权后双向同步'} · ${esc(c.status)}</small></div><button class="btn" onclick="toast('此原型不连接外部账户')">设置</button></div>`).join('')}<button class="btn primary" onclick="addCalendarSource()">＋ 添加工作/个人日历</button><div class="info calendar-info">iCalendar/ICS URL 通常是只读订阅；Google、Microsoft、iCloud/CalDAV 等连接器按授权能力分别标记“只读”或“双向”。外部事件默认只显示在日历，不混进待办清单；需要执行时再转换为全局任务并保留来源。</div>`;else if(preferenceTab==='notifications')content=`<h2>提醒与通知</h2><p class="subtitle">提醒在应用内、浏览器和设备系统中分别控制。外部通知默认关闭。</p><div class="pref-row"><div><b>应用内提醒</b><small>任务到期、逾期、重复任务及你设置提醒的笔记待办</small></div><button class="switch ${p.inAppNotifications===false?'':'on'}" onclick="setPref('inAppNotifications',${p.inAppNotifications===false})"></button></div><div class="pref-row"><div><b>网页浏览器通知</b><small>当前浏览器权限：${typeof Notification==='undefined'?'此环境不支持':Notification.permission==='granted'?'已允许':Notification.permission==='denied'?'已拒绝':'尚未询问'}</small></div><button class="btn primary" onclick="enableWebNotifications()">${p.webNotificationEnabled?'测试网页通知':'开启网页通知'}</button></div><div class="pref-row"><div><b>网页端通知开关</b><small>页面关闭后通知需后台 Web Push 和服务端订阅支持</small></div><button class="switch ${p.webNotificationEnabled?'on':''}" onclick="setPref('webNotificationEnabled',${!p.webNotificationEnabled})"></button></div><div class="pref-row"><div><b>桌面/手机系统通知</b><small>${window.__TAURI__?'调用设备系统通知权限':'前端预览环境；桌面客户端使用系统通知接口'}</small></div><button class="switch ${p.systemNotificationEnabled?'on':''}" onclick="toggleSystemNotifications()"></button></div><div class="pref-row"><div><b>每日计划摘要</b><small>在设定时间汇总今天任务与日程</small></div><button class="switch ${p.dailySummary?'on':''}" onclick="setPref('dailySummary',${!p.dailySummary})"></button></div><div class="pref-row"><div><b>免打扰时间</b><small>免打扰内的提醒延后到结束时间</small></div><button class="switch ${p.quietHours?'on':''}" onclick="setPref('quietHours',${!p.quietHours})"></button></div><div class="pref-row"><div><b>免打扰时段</b><small>本地设备时间</small></div><span>22:00 — 08:00</span></div><div class="pref-row"><div><b>通知声音</b><small>各设备可单独控制</small></div><button class="switch ${p.sound?'on':''}" onclick="setPref('sound',${!p.sound})"></button></div><div class="info">提醒计划跟随对象同步；每台设备的通知权限和开关独立。关闭系统通知不会删除任务提醒，应用内提醒仍按自己的开关运行。</div>`;else if(preferenceTab==='ocr')content=`<h2>图片 OCR</h2><p class="subtitle">识别仅在你开启并明确配置后运行。当前页面是交互原型，不会实际读取图片或连接 OCR 服务。</p><div class="pref-row"><div><b>启用图片文字识别</b><small>关闭后不再为新图片创建识别任务</small></div><button class="switch ${p.ocrEnabled?'on':''}" onclick="setPref('ocrEnabled',${!p.ocrEnabled})"></button></div><div class="pref-row"><div><b>识别引擎</b><small>系统本地 OCR 内置；其他服务由你自定义接入</small></div><select onchange="setPref('ocrProvider',this.value)"><option value="system" ${p.ocrProvider==='system'?'selected':''}>系统本地 OCR（本机支持时）</option><option value="custom" ${p.ocrProvider==='custom'?'selected':''}>自定义 OCR 引擎</option></select></div>${p.ocrProvider==='custom'?`<div class="pref-row"><div><b>自定义引擎接口</b><small>自定义名称、协议与地址；凭据保存在本机密钥库</small></div><button class="btn" onclick="openOcrConfig()">配置接口</button></div>`:''}<div class="pref-row"><div><b>识别语言</b><small>按所选引擎能力提供</small></div><select onchange="setPref('ocrLanguage',this.value)"><option value="zh+en" ${p.ocrLanguage==='zh+en'?'selected':''}>简体中文 + 英文</option><option value="zh">简体中文</option><option value="en">英文</option><option value="auto">自动检测（引擎支持时）</option></select></div><div class="pref-row"><div><b>同步识别文字</b><small>默认仅在本机搜索；开启前确认图片文字可包含敏感信息</small></div><button class="switch ${p.ocrSyncText?'on':''}" onclick="setPref('ocrSyncText',${!p.ocrSyncText})"></button></div><div class="info">不自动下载模型或上传图片。远程自定义引擎必须由你主动配置并确认数据去向。加密笔记的图片仅可在本地解密边界内识别。</div>`;else content=`<h2>隐私与安全</h2><p class="subtitle">敏感内容默认不出设备；提醒只显示标题，诊断数据可随时撤回。</p><div class="pref-row"><div><b>锁屏隐藏笔记内容</b><small>提醒通知只显示标题</small></div><button class="switch ${p.hideLockContent?'on':''}" onclick="setPref('hideLockContent',${!p.hideLockContent})"></button></div><div class="pref-row"><div><b>分析与诊断数据</b><small>可随时撤回</small></div><button class="switch ${p.analytics?'on':''}" onclick="setPref('analytics',${!p.analytics})"></button></div>`;return `<div class="page preferences-page"><div class="page-head"><div><h1>偏好设置</h1><div class="subtitle">外观、任务、日历、通知和隐私都可以按你的习惯调整</div></div></div><div class="preferences-layout"><nav class="preferences-tabs">${tabs.map(([k,label])=>`<button class="pref-tab ${preferenceTab===k?'active':''}" onclick="setPreferenceTab('${k}')">${label}</button>`).join('')}</nav><section class="panel preferences-content">${content}</section></div></div>`}
function openOcrConfig(){document.getElementById('modal').innerHTML=`<h2>自定义 OCR 引擎</h2><label>显示名称</label><input placeholder="由你命名，例如“家中 OCR 服务”"><label>协议</label><select><option>本地 HTTP 接口</option><option>受支持的本机桥接接口</option><option>自定义 HTTPS 接口</option></select><label>接口地址或本机桥接配置</label><input placeholder="填写你自己的接口地址"><div class="info">原型只呈现配置流程，不执行命令、不发送图片、不保存凭据。正式版先验证接口能力，密钥放在系统密钥库。</div><div class="modal-actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn" onclick="toast('此原型不连接或测试外部 OCR')">测试连接</button><button class="btn primary" onclick="closeModal();toast('原型未保存自定义接口')">保存</button></div>`;openModalUI()}
function addCalendarSource(){document.getElementById('modal').innerHTML=`<h2>添加工作/个人日历</h2><label>显示名称</label><input id="calendarName" placeholder="例如：公司日历"><label>接入方式</label><select id="calendarKind"><option>iCalendar URL</option><option>CalDAV</option><option>Google Calendar</option><option>Microsoft Outlook</option><option>iCloud</option></select><label>日历地址（ICS URL 只读）</label><input id="calendarUrl" placeholder="https://…/calendar.ics"><div class="info">原型只演示设置与状态，不会向外部账户发送数据或建立连接。正式版通过后台安全保存授权令牌；URL 订阅默认只读。</div><div class="modal-actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveCalendarSource()">保存来源</button></div>`;openModalUI()}

function settings(){return `<div class="page"><div class="page-head"><div><h1>数据与同步</h1><div class="subtitle">Web 在线通过后台 API；原生客户端可单机运行</div></div></div><div class="info" style="margin-bottom:14px"><b>当前为本地演示模式。</b> 本原型把任务和笔记保存在此浏览器的 IndexedDB 中。正式产品中，Web 在线数据直接通过 API 保存到服务端；桌面/手机客户端可不连接后台独立使用，登录后再同步。Web 离线只使用缓存和待提交队列。</div><div class="settings-grid"><section class="setting-card"><h3>本机数据</h3><p>任务与笔记先写入本机，离线也能继续使用。</p><div class="setting-line"><span>本地数据库<small>IndexedDB · 知行演示版</small></span><span class="status"><i class="dot"></i> 可读写</span></div><div class="setting-line"><span>数据条目<small>${state.tasks.length} 个任务 · ${state.notes.length} 篇笔记</small></span><button class="btn" onclick="toast('本地用量统计为演示数据')">查看</button></div><div class="setting-line"><span>附件空间<small>当前原型仅保存文本内容</small></span><span>—</span></div></section><section class="setting-card"><h3>跨设备同步</h3><p>此处模拟原生客户端的账户同步。正式 Web 端在线时直接通过后台 API 读写；原生客户端登录后同步本地变更。</p><div class="setting-line"><span>${state.settings.sync?'同步已开启':'云同步（可选）'}<small>${state.settings.sync?'演示状态：客户端变更等待服务端':'原型不连接真实云服务'}</small></span><button class="btn ${state.settings.sync?'':'primary'}" onclick="toggleSync()">${state.settings.sync?'暂停同步':'开启同步'}</button></div><div class="setting-line"><span>冲突处理<small>长笔记冲突保留双方版本，避免静默覆盖</small></span><button class="btn" onclick="toast('冲突处理规则见设计文档')">查看规则</button></div><div class="setting-line"><span>设备管理<small>撤销设备将停止该设备后续同步</small></span><button class="btn" onclick="toast('单机模式暂无已连接设备')">管理</button></div></section><section class="setting-card"><h3>备份与恢复</h3><p>导出包含任务、笔记、关联与格式版本的 JSON 文件。正式版还会打包附件并支持加密备份。</p><div class="setting-line"><span>立即备份<small>生成可迁移的 JSON 文件</small></span><button class="btn primary" onclick="exportData()">导出备份</button></div><div class="setting-line"><span>从备份恢复<small>先预览再导入；不会静默覆盖现有数据</small></span><button class="btn" onclick="document.getElementById('importFile').click()">选择文件</button></div></section><section class="setting-card"><h3>时间与提醒</h3><p>定时任务保存 UTC 时间与 IANA 时区；全天任务保存本地日期。提醒由当前设备操作系统调度。</p><div class="setting-line"><span>当前时区<small>Asia/Shanghai · 自动识别</small></span><button class="btn" onclick="toast('正式版可修改时区')">修改</button></div><div class="setting-line"><span>提醒权限<small>浏览器/系统后台策略可能限制投递</small></span><button class="btn" onclick="toast('本原型不申请通知权限')">检查</button></div></section></div><p class="subtitle" style="margin-top:18px">演示边界：此原型用 IndexedDB 模拟本机持久化，未连接产品方案中的 Go/MySQL 后台 API；正式 Web 端在线业务直接调用后台，浏览器只用 IndexedDB 暂存离线队列。云同步、推送提醒、附件加密和云端备份尚未连接真实服务。</p></div>`}
function openClipCapture(){document.getElementById('modal').innerHTML=`<h2>保存网页到知识库</h2><p class="subtitle">默认提取正文并保存为可编辑笔记，也可以归档原网页。</p><label>网页地址</label><input id="clipUrl" placeholder="https://example.com/article"><div class="clip-modes"><label class="clip-mode"><input type="radio" name="clipMode" value="note" checked><span><b>解析为笔记</b><small>提取标题与正文，可搜索、编辑和关联任务</small></span><i>推荐</i></label><label class="clip-mode"><input type="radio" name="clipMode" value="html"><span><b>网页原貌 HTML</b><small>保存可离线查看的网页归档</small></span></label><label class="clip-mode"><input type="radio" name="clipMode" value="pdf"><span><b>打印版 PDF</b><small>适合长期保存版式快照</small></span></label><label class="clip-mode"><input type="radio" name="clipMode" value="link"><span><b>仅保存链接</b><small>不抓取网页内容</small></span></label><label class="clip-combo"><input id="clipArchiveAlso" type="checkbox"> 同时保存解析笔记和网页原貌归档</label></div><div class="info">正式版抓取网页正文并保留来源和抓取时间；本交互原型不会访问你输入的网址，保存后会标明“演示内容”。</div><div class="modal-actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveClipCapture()">开始剪藏</button></div>`;openModalUI()}
function saveClipCapture(){let raw=document.getElementById('clipUrl').value.trim();if(!raw)return toast('请填写网页地址');let u;try{u=new URL(raw)}catch{return toast('请检查网址格式')}if(!['http:','https:'].includes(u.protocol))return toast('只支持 http 或 https 网页');let mode=document.querySelector('input[name="clipMode"]:checked').value,also=document.getElementById('clipArchiveAlso').checked,title=u.hostname.replace(/^www\./,'')+' · 网页剪藏',id='nclip'+Date.now(),clip={title,url:u.href,time:'刚刚',mode:also?'解析为笔记 + 网页原貌':({note:'解析为笔记',html:'网页原貌 HTML',pdf:'打印版 PDF',link:'仅保存链接'}[mode]),status:mode==='link'?'已保存链接':'已保存（演示提取内容）',noteId:null};if(mode==='note'||also){let body=`<p><b>演示提取结果</b>：正式版会读取网页标题、作者、正文和图片，并以可编辑块保存。当前原型不访问外网，以下保留来源信息供交互预览。</p><p>来源：<a href="${esc(u.href)}" target="_blank" rel="noopener noreferrer">${esc(u.href)}</a></p><h2>剪藏内容</h2><p>解析后的正文会进入统一知识搜索，可以添加标签、插入笔记待办，也可以从选区创建全局任务并回链到这篇笔记。</p>`;state.notes.unshift({id,title,folder:'网页剪藏',updated:'刚刚',body});clip.noteId=id}state.clips.unshift(clip);save();closeModal();render();toast(mode==='note'||also?'已剪藏为可编辑知识笔记':'网页剪藏已保存')}
function openCreate(type='task',prefill='',noteId=null){if(type==='clip'){openClipCapture();return}pendingNoteId=noteId;pendingClipIndex=null;pendingHabitId=null;document.getElementById('modal').innerHTML=`<h2>快速创建</h2><label>内容类型</label><select id="kind"><option value="task" ${type==='task'?'selected':''}>任务</option><option value="note" ${type==='note'?'selected':''}>笔记</option><option value="clip" ${type==='clip'?'selected':''}>网页剪藏</option></select><label id="titleLabel">标题</label><input id="newTitle" placeholder="记下一件要做的事…" value="${esc(prefill)}"><div id="moreFields"><label>清单</label><select id="newList"><option>收件箱</option><option>工作</option><option>生活</option><option>阅读计划</option></select><label>安排日期</label><input id="newDate" type="date" value="2026-10-24"></div><div class="modal-actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="createItem()">保存到本机</button></div>`;openModalUI();document.getElementById('kind').onchange=()=>{let v=document.getElementById('kind').value;document.getElementById('moreFields').style.display=v==='task'?'block':'none';document.getElementById('titleLabel').textContent=v==='clip'?'网页标题':'标题';document.getElementById('newTitle').placeholder=v==='clip'?'网页名称…':'输入内容…'};document.getElementById('newTitle').focus()}
function createItem(){let kind=document.getElementById('kind').value,title=document.getElementById('newTitle').value.trim();if(!title)return toast('请先填写标题');if(kind==='task'){let linked=pendingNoteId&&state.notes.find(n=>n.id===pendingNoteId);let clip=pendingClipIndex!==null?state.clips[pendingClipIndex]:null;state.tasks.unshift({id:'t'+Date.now(),title,list:document.getElementById('newList').value,time:'今天',dueDate:document.getElementById('newDate')?.value||'2026-10-24',priority:0,quadrant:4,note:linked?.title||'',noteId:linked?.id||null,sourceUrl:clip?.url||null,habitId:pendingHabitId,done:false});if(linked){linked.updated='刚刚编辑';linked.taskIds||=[];linked.taskIds.push(state.tasks[0].id)}}if(kind==='note')state.notes.unshift({id:'n'+Date.now(),title,folder:'收件箱',updated:'刚刚编辑',body:'<p><br></p>'});if(kind==='clip')state.clips.unshift({title,url:'粘贴的网页链接',time:'刚刚'});pendingNoteId=null;pendingClipIndex=null;pendingHabitId=null;save();closeModal();render();toast(kind==='task'?'任务已加入全局任务列表':'已保存到本机')}
function editTask(id){let t=state.tasks.find(x=>x.id===id);document.getElementById('modal').innerHTML=`<h2>任务详情</h2><label>任务名称</label><input id="editTitle" value="${esc(t.title)}"><label>清单</label><select id="editList">${['工作','生活','阅读计划','收件箱'].map(x=>`<option ${t.list===x?'selected':''}>${x}</option>`).join('')}</select><label>象限</label><select id="editQuadrant">${QUADRANTS.map(q=>`<option value="${q.id}" ${quadOf(t)===q.id?'selected':''}>${q.title}${q.id===4&&!t.quadrant?'（默认）':''}</option>`).join('')}</select><div class="modal-inline"><button class="btn" onclick="setQuadrant('${id}',${quadOf(t)%4+1})">快速切到下一象限</button></div><label>提醒与重复</label><select><option>无提醒</option><option>提前 30 分钟</option><option>每天重复</option><option>每周重复</option></select><div class="info">任务清单、日历、四象限、专注、复盘引用同一任务记录。${t.noteId?`来源笔记：<button class="link-task" onclick="closeModal();openLinkedNote('${t.noteId}')">${esc(t.note||'打开笔记')} ↗</button>`:'可从此处关联知识笔记。'}${t.sourceUrl?`<br>来源剪藏：${esc(t.sourceUrl)}`:''}${t.habitId?`<br>来自习惯：${esc(state.habits.find(h=>h.id===t.habitId)?.title||'习惯')}`:''}<br>关联专注 ${state.focusSessions.filter(f=>f.taskId===t.id).reduce((a,x)=>a+x.minutes,0)} 分钟<br>重复任务修改时会选择仅本次/本次及以后/整条规则。</div><div class="modal-actions"><button class="btn" onclick="closeModal()">关闭</button><button class="btn primary" onclick="saveTask('${id}')">保存</button></div>`;openModalUI()}
function saveTask(id){let t=state.tasks.find(x=>x.id===id);t.title=document.getElementById('editTitle').value;t.list=document.getElementById('editList').value;t.quadrant=+document.getElementById('editQuadrant').value;save();closeModal();render();toast('任务已保存')}
function toggleTask(id){let t=state.tasks.find(x=>x.id===id);t.done=!t.done;t.completedAt=t.done?new Date().toISOString():null;save();render()}
function openLinkedNote(id){selectedNote=id;show('knowledge')}
function createTaskFromNote(id){openCreate('task','',id)}
function createTaskFromClip(i){openCreate('task',state.clips[i].title);pendingClipIndex=i}
function clipToNote(i){let c=state.clips[i],id='n'+Date.now();state.notes.unshift({id,title:c.title,folder:'剪藏箱',updated:'刚刚保存',sourceUrl:c.url,body:`<p>来源：<a href="https://${esc(c.url)}">${esc(c.url)}</a></p><p>剪藏摘要将在正式版导入。</p>`});c.noteId=id;save();selectedNote=id;show('knowledge');toast('剪藏已转为知识笔记')}
function toggleHabit(id,day){let h=state.habits.find(x=>x.id===id);h.week[day]=!h.week[day];h.checkedDays=h.week.filter(Boolean).length;h.logDates ||= {};h.logDates[day]=h.week[day]?new Date().toISOString().slice(0,10):null;save();render();toast(h.week[day]?'习惯打卡已记录':'已撤销本次打卡')}
function createTaskFromHabit(id){pendingHabitId=id;openCreate('task',state.habits.find(h=>h.id===id).title);pendingHabitId=id}
function logFocus(taskId){state.focusSessions.push({id:'f'+Date.now(),taskId,minutes:25,at:new Date().toISOString()});save();render();toast('专注记录已加入任务与复盘数据')}
function saveReviewNote(){let id='n'+Date.now();state.notes.unshift({id,title:'本周复盘',folder:'工作记录',updated:'刚刚编辑',body:`<p>完成任务：${state.tasks.filter(t=>t.done).length} 项</p><p>本地专注：${state.focusSessions.reduce((a,x)=>a+x.minutes,0)} 分钟</p><p>笔记与任务关联：${state.tasks.filter(t=>t.noteId).length} 项</p>`});save();selectedNote=id;show('knowledge');toast('复盘已保存为知识笔记')}

function updateNote(id,body){let n=state.notes.find(x=>x.id===id);n.body=body;n.updated='刚刚编辑';save()}
function updateNoteTitle(id,title){let n=state.notes.find(x=>x.id===id);n.title=title;n.updated='正在编辑';save()}
function format(cmd,arg){document.execCommand(cmd,false,arg);document.getElementById('noteBody')?.focus()}
function toggleSync(){state.settings.sync=!state.settings.sync;save();render();toast(state.settings.sync?'已开启演示同步状态（未连接真实云服务）':'已暂停同步；本机数据保留')}
function exportData(){const blob=new Blob([JSON.stringify({format:'zhixing-backup',version:1,exportedAt:new Date().toISOString(),data:state},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='知行-本机备份-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);toast('备份已导出')}
document.getElementById('importFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.data?.tasks||!x.data?.notes)throw Error();if(confirm(`准备导入 ${x.data.tasks.length} 个任务和 ${x.data.notes.length} 篇笔记。将替换当前演示数据，是否继续？`)){state=x.data;save();render();toast('备份恢复完成')}}catch(_){toast('文件格式不正确，未更改当前数据')}e.target.value=''};r.readAsText(f)};
function openSearch(){document.getElementById('modal').innerHTML=`<h2>搜索任务、笔记与剪藏</h2><input id="searchInput" placeholder="输入关键词…"><div class="search-results" id="results"></div><div class="modal-actions"><button class="btn" onclick="closeModal()">关闭</button></div>`;openModalUI();let input=document.getElementById('searchInput');input.oninput=()=>{let q=input.value.toLowerCase();let hits=[...state.tasks.map(x=>({...x,type:'任务'})),...state.notes.map(x=>({...x,type:'笔记'})),...state.clips.map(x=>({...x,type:'剪藏'}))].filter(x=>(x.title||'').toLowerCase().includes(q));document.getElementById('results').innerHTML=hits.map(x=>`<div class="result" onclick="${x.type==='笔记'?`selectNote('${x.id}');show('knowledge');`:x.type==='任务'?`show('today');`: `show('clips');`}closeModal()"><b>${esc(x.title)}</b><small style="margin-left:8px;color:#95a098">${x.type}</small></div>`).join('')};input.focus()}
function openModalUI(){document.getElementById('modalBack').classList.add('open')}function closeModal(){let m=document.getElementById('modal');if(m.classList.contains('board-modal')&&boardDirty&&!confirm('画板有未保存的修改，退出将丢弃这些修改。确定退出？'))return;m.classList.remove('board-modal');document.getElementById('modalBack').classList.remove('open','board-open');boardDirty=false;editingFigureEl=null}function toast(s){let e=document.getElementById('toast');e.textContent=s;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}function bind(){if(toolMode==='clock'){let el=document.getElementById('clockDisplay');if(el){clearInterval(window.clockTimer);let tick=()=>{let d=new Date();el.textContent=d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false})};tick();window.clockTimer=setInterval(tick,1000)}}}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.addEventListener('keydown',e=>{if(current==='board'&&!e.target.closest('input,textarea,select,[contenteditable=true]')){let key=e.key.toLowerCase();if(key==='escape'){e.preventDefault();returnFromBoard();return}if(key===' '||key==='h'){e.preventDefault();setBoardTool('pan');return}if(['r','s','o','d'].includes(key)){e.preventDefault();addDiagramNode(key==='d'?'decision':key==='o'?'start':'process');return}if(key==='t'){e.preventDefault();addDiagramNode('text');return}if(key==='n'){e.preventDefault();addDiagramNode('sticky');return}if(key==='a'){e.preventDefault();toggleBoardConnector();return}}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='n'){e.preventDefault();openCreate()}if(e.key==='Escape')closeModal()});document.addEventListener('beforeunload',e=>{if(diagramState&&boardDirty){e.preventDefault();e.returnValue=''}});
</script></body></html>
